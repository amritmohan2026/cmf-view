<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CMF View Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap">
<style>
html,body{margin:0;background:#fff;color:#434343}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
.rd{--amber:#f7b133;--peach:#fce5cd;--cream:#fefaf7;--tx:#434343;--tx2:#666666;--tx3:#8c8c8c;--line:#eadfd2;--red:#d9604c;--blue:#4a90b8;--green:#5a9e6f;--c0:#f7b133;--c1:#5a9e6f;
 font-family:'Roboto',Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:var(--tx);background:#fff;color-scheme:light;max-width:1240px;margin-inline:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:40px}
.rd *{box-sizing:border-box;font-family:inherit}
.rd .hdr{border-bottom:3px solid var(--amber);padding-bottom:10px}
.rd .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 6px}
.rd h1{margin:0;font-size:22px;font-weight:700;color:var(--tx);letter-spacing:.2px;line-height:1.2}
.rd .sub{color:var(--tx2);font-size:13px;margin-top:2px}
.rd .logo{height:40px;width:auto;flex:none}
.rd .take{margin:6px 0 0;color:var(--tx2);font-size:13px;max-width:90ch}
.rd .asof{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--tx3);font-size:12px;margin-top:6px}
.rd .asof b{color:var(--tx2);font-weight:500}
.rd .tabs{position:sticky;top:0;z-index:7;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;align-items:center}
.rd .tabs button{flex:none;border:0;border-radius:0;background:none;font:500 14px 'Roboto',Arial,sans-serif;color:var(--tx2);padding:13px 14px;height:auto;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.rd .tabs button[aria-selected=true]{color:var(--tx);border-bottom-color:var(--amber);font-weight:700;background:none}
.rd .tabs .grp{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin:0 6px 0 8px;white-space:nowrap}
.rd .tabs .sep{width:1px;height:22px;background:var(--line);margin:0 10px;flex:none}
.rd .bar{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end}
.rd .fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.rd .fld label{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px}
.rd select,.rd input[type=search]{font:400 14px 'Roboto',Arial,sans-serif;color:var(--tx);background:#fff;border:1px solid #d9cfc3;border-radius:8px;padding:8px 10px;min-height:38px;min-width:0;max-width:100%;width:10.5rem}
.rd input[type=search]{width:14rem}
.rd button{font:500 13px 'Roboto',Arial,sans-serif;color:var(--tx);background:#fff;border:1px solid #d9cfc3;border-radius:8px;padding:8px 14px;cursor:pointer}
.rd button:hover{border-color:var(--amber)}
.rd button:focus-visible,.rd select:focus-visible,.rd input:focus-visible,.rd summary:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.rd .cnt{margin-left:auto;font-size:12px;color:var(--tx3);align-self:center}
.rd .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.rd .tile{background:#fff;border:1px solid var(--line);border-top:3px solid var(--amber);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rd .tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3)}
.rd .tile .v{font-size:24px;font-weight:700;color:var(--tx);line-height:1.15;font-variant-numeric:tabular-nums}
.rd .tile .n{font-size:12px;color:var(--tx2)}
.rd .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:14px}
.rd .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:6px}
.rd .card.wide{grid-column:1/-1}
.rd .card h3{margin:0;font-size:16px;font-weight:700;color:var(--tx)}
.rd .card .sub{margin:0 0 4px;font-size:12px;color:var(--tx3)}
.rd .bl{display:flex;flex-direction:column;gap:5px}
.rd .bl-row{display:grid;grid-template-columns:minmax(6rem,38%) 1fr auto;gap:8px;align-items:center;text-align:left;border:0;border-radius:6px;background:none;padding:2px 4px;font-size:13px;color:var(--tx);width:100%}
.rd button.bl-row:hover{background:var(--cream)}
.rd button.bl-row.on{background:var(--peach)}
.rd .bl-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd .bl-t{height:16px;background:#f6f1ea;border-radius:4px;overflow:hidden}
.rd .bl-t i{display:block;height:100%;border-radius:4px;min-width:2px}
.rd .bl-v{font-variant-numeric:tabular-nums;color:var(--tx);font-weight:500;font-size:12.5px;white-space:nowrap}
.rd table.t{width:100%;border-collapse:collapse;font-size:13px}
.rd table.t th,.rd table.t td{text-align:right;padding:8px 10px;border-bottom:1px solid #f1ebe3;font-variant-numeric:tabular-nums;white-space:nowrap}
.rd table.t th{background:var(--cream);color:var(--tx2);font-weight:500;border-bottom:2px solid var(--peach)}
.rd table.t th:first-child,.rd table.t td:first-child{text-align:left}
.rd .scroll{overflow-x:auto}
.rd .note{font-size:12px;color:var(--tx3)}
.rd .chips{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.rd .chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--tx2);cursor:pointer}
.rd .pill{display:inline-block;font-size:12px;line-height:1.3;padding:2px 8px;border-radius:99px;font-weight:500;white-space:nowrap}
.rd .pill.Critical{background:var(--red);color:#fff}
.rd .pill.Warning{background:var(--amber);color:var(--tx)}
.rd .pill.Info{background:#ececec;color:var(--tx2)}
.rd .flist{display:flex;flex-direction:column;gap:8px}
.rd details.rw{border:1px solid var(--line);border-radius:10px;background:#fff}
.rd details.rw[open]{border-color:var(--amber)}
.rd details.rw>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(9rem,1.2fr) minmax(8rem,1fr) 3fr;gap:10px;align-items:center;padding:10px 12px}
.rd details.rw>summary::-webkit-details-marker{display:none}
.rd details.rw[open]>summary{border-bottom:1px solid var(--line);background:var(--cream);border-radius:10px 10px 0 0}
.rd .rw-n{font-weight:700;min-width:0;color:var(--tx)}
.rd .rw-n small,.rd .rw-m small{display:block;color:var(--tx3);font-size:12px;font-weight:400}
.rd .rw-m{color:var(--tx)}
.rd .rw-f{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.rd .rw-b{padding:12px;display:flex;flex-direction:column;gap:10px}
.rd .contact{font-size:12px;color:var(--tx2);display:flex;flex-wrap:wrap;gap:4px 16px}
.rd .fi{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;padding:8px 0;border-top:1px dashed var(--line)}
.rd .fi:first-of-type{border-top:0}
.rd .fi .ft{font-weight:700;color:var(--tx)}
.rd .fi .fd{color:var(--tx2);font-size:12.5px}
.rd .fi .fa{font-size:13px;margin-top:3px;background:var(--cream);border-left:3px solid var(--amber);padding:5px 8px;border-radius:4px;color:var(--tx2)}
.rd .fi .fa b{font-weight:700;color:var(--tx)}
.rd .cp{align-self:flex-start}
.rd textarea.cpt{width:100%;min-height:7rem;font-size:12.5px;background:#fff;color:var(--tx);border:1px solid #d9cfc3;border-radius:8px;padding:6px}
.rd .tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.12);padding:6px 10px;font-size:12px;white-space:nowrap;z-index:6;color:var(--tx)}
.rd .chartbox{position:relative;min-height:220px}
.rd .more{align-self:center}
.rd .heat td.c,.rd .heat th.c{text-align:center}
.rd details.how{font-size:13px;color:var(--tx2);background:var(--cream);border-left:4px solid var(--amber);border-radius:6px;padding:10px 12px}
.rd details.how summary{cursor:pointer;color:var(--tx);font-weight:500}
.rd footer{color:var(--tx3);font-size:12px}
@media (min-width:821px){.rd .fbox>summary{display:none}}
.rd .fbox>summary{cursor:pointer;list-style:none;font-weight:500;padding:11px 14px;background:var(--cream);border:1px solid var(--line);border-radius:10px;color:var(--tx)}
.rd .fbox>summary::-webkit-details-marker{display:none}
.rd .fbox>summary span{color:var(--tx3);font-weight:400;font-size:12px;margin-left:6px}
.rd .fbox[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
.rd .fbox[open]>.bar{border-top:0;border-top-left-radius:0;border-top-right-radius:0}
@media (max-width:820px){
.rd .fld{flex:1 1 44%}.rd select,.rd input[type=search]{width:100%;font-size:16px}.rd .fld:has(#f-q){flex-basis:100%}
.rd .tabs .grp{display:none}.rd .tabs button{padding:12px 12px}
.rd .bl-row{grid-template-columns:minmax(5rem,36%) 1fr auto;gap:6px}
.rd .card{padding:12px}.rd .grid,.rd .tiles{gap:10px}
.rd .fi{grid-template-columns:1fr}.rd .fi>.pill{justify-self:start}
.rd .rw-f .pill{white-space:normal}
.rd button{min-height:38px}.rd .cp{width:100%}
.rd .hd{padding-top:10px}.rd .sub{font-size:12px}
.rd h1{font-size:18px}.rd .logo{height:30px}.rd details.rw>summary{grid-template-columns:auto 1fr}.rd details.rw>summary .rw-m,.rd details.rw>summary .rw-f{grid-column:1/-1}.rd select{width:9rem}.rd input[type=search]{width:100%}.rd .cnt{margin-left:0;width:100%}.rd .tile .v{font-size:21px}}
.rd table.t th.l,.rd table.t td.l{text-align:left}
.rd table.t tr.tot td{font-weight:700;border-top:2px solid var(--peach)}
.rd table.t tr.clk{cursor:pointer}.rd table.t tr.clk:hover td{background:var(--cream)}
.rd .pb{display:inline-block;width:70px;height:8px;background:#f6f1ea;border-radius:4px;vertical-align:middle;margin-right:8px;overflow:hidden}
.rd .pb i{display:block;height:100%;background:var(--c1)}
.rd .pill.ok{background:#dcefe2;color:#2f6a43}
.rd a.lnk{color:#2f6f94;text-decoration:none;font-weight:500}.rd a.lnk:hover{text-decoration:underline}
.rd [hidden]{display:none!important}

.rd .aon{margin-top:6px;font-size:13px;color:#434343}.rd .aon b{font-weight:500;background:#fdf1d6;border-radius:10px;padding:2px 10px}
.rd .xlbar{display:flex;justify-content:flex-end}
.rd .xlb{float:right;font:500 12px Roboto,'Noto Sans Devanagari',sans-serif;background:transparent;border:1px solid #f7b133;color:#8a5a00;border-radius:12px;padding:2px 10px;margin-left:8px;cursor:pointer}
.rd .xlb:hover{background:#fdf0d5}
.rd .dlbtn{font:500 14px Roboto,'Noto Sans Devanagari',sans-serif;background:#f7b133;border:0;color:#2b2b2b;border-radius:18px;padding:8px 18px;cursor:pointer}
.rd .ccbtn{font:500 13px Roboto,'Noto Sans Devanagari',sans-serif;background:#fff;border:1px solid #c25a47;color:#a23b2a;border-radius:16px;padding:5px 14px;cursor:pointer}
.rd .ccbtn.on{background:#c25a47;color:#fff}
.rd .ccbtn.nr{border-color:#d19a1c;color:#8a6200}.rd .ccbtn.nr.on{background:#f7b133;color:#2b2b2b}
.rd .rjr{max-width:170px;white-space:normal;line-height:1.3;color:#a23b2a;font-size:12px;margin-top:3px}
.rd .tabs{position:static;flex-wrap:wrap;overflow:visible;gap:8px;padding:14px 0 12px;border-bottom:1px solid var(--line)}
.rd .tabs .sep{display:none}
.rd .tabs button{font:500 16px Roboto,'Noto Sans Devanagari',sans-serif;color:#434343;background:#fff;border:1px solid #d9d9d9;border-radius:22px;padding:9px 18px;margin:0;border-bottom:1px solid #d9d9d9}
.rd .tabs button:hover{border-color:#f7b133}
.rd .tabs button[aria-selected=true]{background:#f7b133;border-color:#f7b133;color:#2b2b2b;font-weight:700}
@media(max-width:820px){.rd .tabs{gap:6px}.rd .tabs button{font-size:14px;padding:8px 13px}}
.rd .lang{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:8px 0 0}
.rd .lang .lg-l{font-size:12px;color:#7a7a7a;margin-right:4px}
.rd .lang button{font:500 13px Roboto,'Noto Sans Devanagari',sans-serif;border:1px solid #f7b133;background:#fff;color:#434343;border-radius:16px;padding:5px 14px;cursor:pointer}
.rd .lang button[aria-pressed=true]{background:#f7b133;color:#2b2b2b}
.rd .lang button:focus-visible{outline:2px solid #2f6f94;outline-offset:2px}
#dash-root.hi .rd,#dash-root.hi .rd *{font-family:'Noto Sans Devanagari',Roboto,sans-serif}
#dash-root.hi .rd .lang button{font-family:'Noto Sans Devanagari',Roboto,sans-serif}

</style>

answers that contradict each other, and registration status. Limits depend on business type. For a Kirana/General Store (and other stores) the turnover warning starts at ₹1 L a month and critical at ₹2.5 L; spend per customer warns above ₹2,500 and is critical above ₹6,000 a month. Tailoring, Beauty Parlor and CSC use ₹40K and ₹1,500 as warning limits, with critical at ₹1 L turnover and ₹4,000 per customer. Monthly turnover comes from the monthly answer, or from the daily sales answer x 25 days where only the daily question was filled. Investment is also flagged when it is more than 100 times the monthly turnover. Top-5 products are checked too: brands such as \"Good\" or \"Local\", the same brand repeated for every product, blank brands for shops, and names that look like a misspelling of a known brand. GPS is flagged when it falls outside the three CMF blocks or when three or more RWEs share one point.": "हर पंजीकृत RWE की जाँच बिक्री, ग्राहक, प्रति ग्राहक खर्च, लगाई रकम, व्यवसाय के साल, उम्र, मोबाइल, पिनकोड, GPS, बैंक और KYC की जानकारी, आपस में उल्टे जवाब और पंजीकरण की स्थिति पर होती है। सीमाएँ व्यवसाय के प्रकार पर निर्भर हैं। किराना/जनरल स्टोर (और अन्य दुकानों) में बिक्री की सावधानी ₹1 लाख महीने से और गंभीर ₹2.5 लाख से शुरू होती है; प्रति ग्राहक खर्च ₹2,500 से ऊपर सावधानी और ₹6,000 महीने से ऊपर गंभीर है। सिलाई, ब्यूटी पार्लर और CSC में सावधानी की सीमा ₹40 हज़ार और ₹1,500 है, और गंभीर सीमा ₹1 लाख बिक्री और ₹4,000 प्रति ग्राहक। महीने की बिक्री महीने के जवाब से ली जाती है, या जहाँ सिर्फ़ रोज़ की बिक्री भरी गई वहाँ रोज़ की बिक्री × 25 दिन से। लगाई रकम महीने की बिक्री के 100 गुना से ज़्यादा हो तो भी चेतावनी लगती है। शीर्ष 5 सामान भी जाँचे जाते हैं: \"Good\" या \"Local\" जैसे ब्रांड, हर सामान के लिए एक ही ब्रांड, दुकानों में खाली ब्रांड, और ऐसे नाम जो किसी जाने-पहचाने ब्रांड की गलत वर्तनी लगें। GPS पर चेतावनी तब लगती है जब वह तीनों CMF ब्लॉकों से बाहर हो या तीन या ज़्यादा RWE एक ही बिंदु पर हों।", "Two further limits were set for CMF: daily sales above ₹1,000 (Kirana), ₹750 (Fancy), ₹600 (Beauty) or ₹500 (Tailoring), and more than 25 (Kirana), 40 (Fancy), 30 (Beauty) or 20 (Tailoring) unique customers a month are flagged as warnings. Daily sales come from the daily answer, or the monthly turnover divided by 25. Two flags are specific to CMF. \"Not matched to the target list\" marks a registration since 28 Oct that has no name match on the 398-RWE list. \"Looks like a test record\" marks a male record whose name matches a MAT. Older records from earlier programmes often carry a default date of birth, which is why many show an age below 18.": "CMF के लिए दो और सीमाएँ तय हैं: रोज़ की बिक्री ₹1,000 (Kirana), ₹750 (Fancy), ₹600 (Beauty) या ₹500 (Tailoring) से ऊपर, और महीने में 25 (Kirana), 40 (Fancy), 30 (Beauty) या 20 (Tailoring) से ज़्यादा अलग-अलग ग्राहक, सावधानी की चेतावनी बनते हैं। रोज़ की बिक्री रोज़ के जवाब से ली जाती है, या महीने की बिक्री को 25 से भाग देकर। दो चेतावनियाँ सिर्फ़ CMF की हैं। \"Not matched to the target list\" 28 अक्टूबर के बाद के ऐसे पंजीकरण को दिखाती है जिसका 398 RWE की सूची में नाम नहीं मिला। \"Looks like a test record\" ऐसे पुरुष रिकॉर्ड को दिखाती है जिसका नाम किसी MAT से मिलता है। पुराने कार्यक्रमों के पुराने रिकॉर्ड में अक्सर डिफ़ॉल्ट जन्मतिथि होती है, इसीलिए कई में उम्र 18 से कम दिखती है।", "Daily sales ₹": "रोज़ की बिक्री ₹", ", above the ₹": ", सीमा ₹", " limit for a ": " से ज़्यादा, व्यवसाय: ", "Kirana store": "किराना दुकान", "Fancy store": "फ़ैंसी स्टोर", "Beauty parlor": "ब्यूटी पार्लर", " unique customers a month, above the ": " अलग-अलग ग्राहक महीने में, सीमा ", " x 25 days": " x 25 दिन", " a month": " महीना", " per customer": " प्रति ग्राहक", " customers": " ग्राहक", " years in business, age ": " साल का व्यवसाय, उम्र ", "Age ": "उम्र ", "DOB ": "जन्मतिथि ", "Marked ": "चुना गया: ", " in one form, ": " एक फ़ॉर्म में, ", " in the other": " दूसरे में", " invested, ₹": " लगाए, ₹", " turnover a month": " महीने की बिक्री", " turnover": " बिक्री", " of 5 products given": " सामान 5 में से दिए", "Brands giv ाहक या हज़ार में भर दी गई।", "Turnover is zero, negative or not a valid number": "बिक्री शून्य, ऋण या गलत संख्या है", "Re-collect the turnover (average daily sale x 25 days) and update the form.": "बिक्री दोबारा पूछें (रोज़ की औसत बिक्री x 25 दिन) और फ़ॉर्म ठीक करें।", "Spend per customer per month is impossible for a rural last-mile shop": "एक ग्राहक का महीने का खर्च गाँव की दुकान के लिए असंभव है", "Ask both numbers again. Check how many customers buy in a normal week and how much one customer spends in a month. Correct turnover or customer count, whichever is wrong.": "दोनों संख्याएँ दोबारा पूछें। देखें कि आम हफ़्ते में कितने ग्राहक आते हैं और एक ग्राहक महीने में कितना खर्च करता है। बिक्री या ग्राहक संख्या, जो गलत हो, ठीक करें।", "Spend per customer per month looks high": "एक ग्राहक का महीने का खर्च ज़्यादा लगता है", "Re-confirm the unique customer count and the turnover. Most likely the customer count is understated.": "अलग-अलग ग्राहकों की संख्या और बिक्री दोबारा पूछें। संभव है कि ग्राहक संख्या कम लिखी गई हो।", "Spend per customer per month is too low": "एक ग्राहक का महीने का खर्च बहुत कम है", "Re-confirm the customer count. It may have been entered as total footfall or in the wrong unit.": "ग्राहक संख्या दोबारा पूछें। हो सकता है कुल आवाजाही या गलत इकाई भर दी गई हो।", "Customer count is not possible for this business": "ग्राहकों की संख्या इस व्यवसाय में संभव नहीं है", "Re-ask the number of different customers served in a month and correct it. Counts this large are usually extra zeros or a phone number typed in the field.": "महीने में कितने अलग-अलग ग्राहक आते हैं, दोबारा पूछकर ठीक करें। इतनी बड़ी संख्या अक्सर फ़ालतू शून्य या खाने में मोबाइल नंबर लिख देने से होती है।", "Customer count looks too high for this business type": "ग्राहकों की संख्या इस व्यवसाय के लिए ज़्यादा लगती है", "Check against her daily footfall and correct if needed.": "रोज़ की आवाजाही से मिलाकर देखें और ज़रूरत हो तो ठीक करें।", "Reports sales but zero customers": "बिक्री बताई है पर ग्राहक शून्य हैं", "Re-collect the unique customer count.": "अलग-अलग ग्राहकों की संख्या दोबारा पूछें।", "Investment in the business is not credible": "व्यवसाय में लगाई रकम भरोसे लायक नहीं है", "Re-ask the total money put into stock and equipment. Correct the amount; values like these are usually extra zeros or an ID typed in the field.": "माल और सामान में लगी कुल रकम दोबारा पूछें और ठीक करें। ऐसी रकम अक्सर फ़ालतू शून्य या खाने में ID लिख देने से होती है।", "Investment looks very high for a village micro-business": "गाँव के छोटे व्यवसाय के लिए लगाई रकम बहुत ज़्यादा लगती है", "Re-confirm the investment amount with her.": "उससे लगाई रकम दोबारा पक्की करें।", "Investment far too low for the reported turnover": "बताई गई बिक्री के हिसाब से लगाई रकम बहुत कम है", "Ask what the shop stock and equipment is worth and correct the investment.": "पूछें कि दुकान का माल और सामान कितने का है और लगाई रकम ठीक करें।", "Business tenure is impossible": "व्यवसाय के सालों की संख्या असंभव है", "Re-ask how many years she has been running the business and correct it. The value looks like a year or a typing error.": "उससे पूछें कि वह कितने साल से व्यवसाय चला रही है और ठीक करें। यह संख्या साल या टाइपिंग की गलती लगती है।", "Business tenure does not fit her age": "व्यवसाय के साल उसकी उम्र से मेल नहीं खाते", "Verify her date of birth and the year she started the business, and correct whichever is wrong.": "उसकी जन्मतिथि और व्यवसाय शुरू करने का साल जाँचें और जो गलत हो उसे ठीक करें।", "RWE appears to be under 18": "RWE की उम्र 18 से कम लगती है", "Check her Aadhaar for the correct date of birth. A date of birth close to the registration date is usually a form default. If she is under 18, she is not eligible, so inform the MAT.": "सही जन्मतिथि के लिए उसका आधार देखें। पंजीकरण की तारीख के पास की जन्मतिथि अक्सर फ़ॉर्म की डिफ़ॉल्ट होती है। अगर वह 18 से कम है तो पात्र नहीं है, MAT को बताएँ।", "RWE is above 65": "RWE की उम्र 65 से ज़्यादा है", "Confirm the date of birth, and confirm she runs the business herself.": "जन्मतिथि पक्की करें और यह भी कि व्यवसाय वह खुद चलाती है।", "Date of birth is 1 January (likely a placeholder)": "जन्मतिथि 1 जनवरी है (शायद डिफ़ॉल्ट तारीख)", "Take the exact date of birth from her Aadhaar and update it.": "उसके आधार से सही जन्मतिथि लेकर अपडेट करें।", "Confirm with the MAT whether this is a test or a self-registration. If it is, ask the tech team to delete it from the system.": "MAT से पूछें कि यह टेस्ट है या खुद का पंजीकरण। अगर टेस्ट है तो टेक टीम से सिस्टम से हटवाएँ।", "RWE is not marked female": "RWE को महिला नहीं चुना गया है", "Confirm the registration is for a woman entrepreneur. If the gender was selected wrongly, correct it. Otherwise the record is not eligible.": "पक्का करें कि पंजीकरण महिला उद्यमी का है। अगर लिंग गलत चुना गया है तो ठीक करें, नहीं तो यह रिकॉर्ड पात्र नहीं है।", "Mobile number looks fake": "मोबाइल नंबर नकली लगता है", "Collect a working personal mobile number and update it. Call it once to confirm.": "चालू निजी मोबाइल नंबर लेकर अपडेट करें। एक बार फ़ोन करके पक्का करें।", "GPS location is outside the CMF blocks": "GPS लोकेशन CMF ब्लॉकों से बाहर है", "Re-capture the shop location with the app while standing at the shop.": "दुकान पर खड़े होकर ऐप से दुकान की लोकेशन दोबारा लें।", "GPS location is far from her village": "GPS लोकेशन उसके गाँव से बहुत दूर है", "Re-capture the shop location while standing at the shop. Check that the village is correct.": "दुकान पर खड़े होकर लोकेशन दोबारा लें। जाँचें कि गाँव सही है।", "Same GPS point as other RWEs": "दूसरे RWE के साथ एक ही GPS बिंदु है", "Several registrations came from one spot, probably a single place such as an office. Re-capture each shop location at the shop.": "कई पंजीकरण एक ही जगह से हुए हैं, शायद किसी दफ़्तर से। हर दुकान की लोकेशन दुकान पर जाकर दोबारा लें।", "Pincode is invalid": "पिनकोड गलत है", "Take the correct 6-digit pincode of the shop location and update it.": "दुकान की जगह का सही 6 अंकों का पिनकोड लेकर अपडेट करें।", "Business name looks like junk": "व्यवसाय का नाम बेकार लगता है", "Take the real shop or centre name (board name) and update it.": "दुकान या केंद्र का असली नाम (बोर्ड का नाम) लेकर अपडेट करें।", "Business name does not match the business type": "व्यवसाय का नाम व्यवसाय के प्रकार से मेल नहीं खाता", "Confirm what she actually sells or does. Correct either the business type or the shop name.": "पक्का करें कि वह असल में क्या बेचती या करती है। व्यवसाय का प्रकार या दुकान का नाम ठीक करें।", "Business type differs between the two forms": "दोनों फ़ॉर्म में व्यवसाय का प्रकार अलग है", "Confirm her main business and make the type the same in both forms.": "उसका मुख्य व्यवसाय पक्का करें और दोनों फ़ॉर्म में एक ही प्रकार रखें।", "Top-5 selling products not filled": "सबसे ज़्यादा बिकने वाले 5 सामान नहीं भरे", "Ask for her 5 best-selling products and enter product names.": "उसके सबसे ज़्यादा बिकने वाले 5 सामान पूछें और उनके नाम भरें।", "Products listed do not fit the business type": "बताए गए सामान व्यवसाय के प्रकार से मेल नहीं खाते", "Check the products against what she sells. Correct the business type or the product list.": "सामान को उसकी दुकान से मिलाकर देखें। व्यवसाय का प्रकार या सामान की सूची ठीक करें।", "IFSC code is invalid": "IFSC कोड गलत है", "Copy the IFSC from the passbook or cheque and enter it again. A wrong IFSC will fail payouts.": "पासबुक या चेक से IFSC देखकर दोबारा भरें। गलत IFSC से भुगतान रुक जाएगा।", "Bank account number has an invalid length": "बैंक खाता संख्या की लंबाई गलत है", "Copy the account number from the passbook again.": "पासबुक से खाता संख्या दोबारा लिखें।", "Name on bank account does not match RWE name": "बैंक खाते का नाम RWE के नाम से नहीं मिलता", "Confirm that the account is in her own name. If it is in a family member's name, record that and get the right account.": "पक्का करें कि खाता उसके अपने नाम पर है। अगर परिवार के किसी सदस्य के नाम पर है तो यह लिखें और सही खाता लें।", "PAN number is invalid or a placeholder": "PAN नंबर गलत है या यूँ ही भरा है", "Collect the real PAN, or record that she has no PAN.": "असली PAN लें, या लिखें कि उसके पास PAN नहीं है।", "Says she knows government schemes and also that she does not": "कहती है सरकारी योजनाएँ जानती है और यह भी कि नहीं जानती", "Ask again and keep one answer.": "दोबारा पूछें और एक ही जवाब रखें।", "Says she receives support and also no support": "कहती है मदद मिलती है और यह भी कि कोई मदद नहीं मिलती", "Ask which support she gets and correct the answer.": "पूछें कि कौन-सी मदद मिलती है और जवाब ठीक करें।", "Says she never took a loan and also lists a loan source": "कहती है कभी कर्ज़ नहीं लिया और कर्ज़ का स्रोत भी बताया है", "Ask again and keep the correct answer.": "दोबारा पूछें और सही जवाब रखें।", "Says she is in no cadre and also lists a cadre": "कहती है किसी कैडर में नहीं है और कैडर भी बताया है", "Ask which cadres she belongs to and correct it.": "पूछें कि वह किन कैडर में है और ठीक करें।", "Says nobody else in the family earns and also lists family work": "कहती है परिवार में कोई और नहीं कमाता और परिवार का काम भी बताया है", "Ask who in the family works and correct it.": "पूछें कि परिवार में कौन काम करता है और ठीक करें।", "Says she is not digital but lists apps she uses": "कहती है डिजिटल नहीं है पर इस्तेमाल किए ऐप बताए हैं", "Ask which apps she uses on her own and correct the answer.": "पूछें कि वह खुद कौन-से ऐप इस्तेमाल करती है और जवाब ठीक करें।", "Uses only a keypad phone but lists mobile apps": "सिर्फ़ कीपैड फ़ोन बताया पर मोबाइल ऐप भी बताए हैं", "Ask whether she uses a family member's phone for these apps, and note it.": "पूछें कि क्या वह इन ऐप के लिए परिवार के किसी सदस्य का फ़ोन इस्तेमाल करती है और यह लिख लें।", "SHG answer does not match SHG details": "SHG का जवाब SHG की जानकारी से मेल नहीं खाता", "Ask again if she is in an SHG and take the SHG name and code, or correct it to No.": "दोबारा पूछें कि वह SHG में है या नहीं, और SHG का नाम व कोड लें, या जवाब 'नहीं' कर दें।", "Agriculture answer does not match land or crops": "खेती का जवाब ज़मीन या फ़सल से मेल नहीं खाता", "Ask again if the family farms. Correct land area and crops, or , Parle-G) and enter it. Words like \"Good\" or \"Local\" are not brands.": "उससे उसके पाँच सबसे ज़्यादा बिकने वाले सामान का असली ब्रांड पूछें (जैसे Ponds, Parle-G) और भरें। \"Good\" या \"Local\" जैसे शब्द ब्रांड नहीं हैं।", "Product or brand name looks misspelled": "सामान या ब्रांड का नाम गलत लिखा लगता है", "Check the spelling against the pack in her shop and correct the name.": "उसकी दुकान के पैकेट से वर्तनी मिलाकर नाम ठीक करें।", "Investment is far above the reported turnover": "लगाई रकम बताई गई बिक्री से बहुत ज़्यादा है", "Re-ask both the money put into the shop and the daily sale. One of them is probably wrong, often the daily sale entered in thousands or a single day.": "दुकान में लगी रकम और रोज़ की बिक्री दोनों दोबारा पूछें। इनमें से एक शायद गलत है, अक्सर रोज़ की बिक्री हज़ार में या सिर्फ़ एक दिन की भरी जाती है।", "Monthly turnover worked out from daily sales x 25": "महीने की बिक्री रोज़ की बिक्री x 25 से निकाली गई है", "No action. Check the daily sale only if another turnover flag is shown.": "कुछ करना नहीं है। रोज़ की बिक्री तभी जाँचें जब कोई और बिक्री वाली चेतावनी दिखे।", "Earlier registration not updated on the day the MAT visited": "MAT के जाने वाले दिन पुराना पंजीकरण अपडेट नहीं हुआ", "The RWE was registered by FM before 28 Oct and the MAT worked with her (LMS or a visit), but her registration details were not updated that day. Open her record in the app with her, correct the General and KYC details and resubmit, so the update date matches the visit.": "इस RWE को 28 अक्टूबर से पहले FM ने पंजीकृत किया था और MAT ने उसके साथ काम किया (LMS या मुलाक़ात), पर उस दिन उसकी पंजीकरण जानकारी अपडेट नहीं हुई। ऐप में उसके साथ उसका रिकॉर्ड खोलें, General और KYC की जानकारी ठीक करके दोबारा जमा करें, ताकि अपडेट की तारीख मुलाक़ात के दिन से मेल खाए।", "Daily sales above the limit set for this business type": "रोज़ की बिक्री इस व्यवसाय की तय सीमा से ज़्यादा है", "Limits per day: Kirana ₹1,000, Fancy ₹750, Beauty ₹600, Tailoring ₹500. Visit the shop, check the cash register an WE", "Click to filter.": "फ़िल्टर करने के लिए दबाएँ।", "Branch as recorded in the registration form.": "पंजीकरण फ़ॉर्म में दर्ज शाखा।", "The five groups used on this dashboard. Click to filter.": "इस डैशबोर्ड में इस्तेमाल हुए पाँच समूह। फ़िल्टर करने के लिए दबाएँ।", "Deleted records excluded": "हटाए गए रिकॉर्ड शामिल नहीं", "How the flags are decided": "चेतावनी कैसे तय होती है", "Each registered RWE is checked on turnover, customers, spend per customer, investment, tenure, age, mobile, pincode, GPS, bank and KYC details, answers that contradict each other, and registration status. Limits depend on business type. For a Kirana/General Store (and other stores) the turnover warning starts at ₹1 L a month and critical at ₹2.5 L; spend per customer warns above ₹2,500 and is critical above ₹6,000 a month. Tailoring, Beauty Parlor and CSC use ₹40K and ₹1,500 as warning limits, with critical at ₹1 L turnover and ₹4,000 per customer. Monthly turnover comes from the monthly answer, or from the daily sales answer x 25 days where only the daily question was filled. Investment is also flagged when it is more than 100 times the monthly turnover. Top-5 products are checked too: brands such as \"Good\" or \"Local\", the same brand repeated for every product, blank brands for shops, and names that look like a misspelling of a known brand. GPS is flagged when it falls outside the three CMF blocks or when three or more RWEs share one point.": "हर पंजीकृत RWE की जाँच बिक्री, ग्राहक, प्रति ग्राहक खर्च, लगाई रकम, व्यवसाय के साल, उम्र, मोबाइल, पिनकोड, GPS, बैंक और KYC की जानकारी, आपस में उल्टे जवाब और पंजीकरण की स्थिति पर होती है। सीमाएँ व्यवसाय के प्रकार पर निर्भर हैं। किराना/जनरल स्टोर (और अन्य दुकानों) में बिक्री की सावधानी ₹1 लाख महीने से और गंभीर ₹2.5 लाख से शुरू होती है; प्रति ग्राहक खर्च ₹2,500 से ऊपर सावधानी और ₹6,000 महीने से ऊपर गंभीर है। सिलाई, ब्यूटी पार्लर और CSC में सावधानी की सीमा ₹40 हज़ार और ₹1,500 है, और गंभीर सीमा ₹1 लाख बिक्री और ₹4,000 प्रति ग्राहक। महीने की बिक्री महीने के जवाब से ली जाती है, या जहाँ सिर्फ़ रोज़ की बिक्री भरी गई वहाँ रोज़ की बिक्री × 25 दिन से। लगाई रकम महीने की बिक्री के 100 गुना से ज़्यादा हो तो भी चेतावनी लगती है। शीर्ष 5 सामान भी जाँचे जाते हैं: \"Good\" या \"Local\" जैसे ब्रांड, हर सामान के लिए एक ही ब्रांड, दुकानों में खाली ब्रांड, और ऐसे नाम जो किसी जाने-पहचाने ब्रांड की गलत वर्तनी लगें। GPS पर चेतावनी तब लगती है जब वह तीनों CMF ब्लॉकों से बाहर हो या तीन या ज़्यादा RWE एक ही बिंदु पर हों।", "Two further limits were set for CMF: daily sales above ₹1,000 (Kirana), ₹750 (Fancy), ₹600 (Beauty) or ₹500 (Tailoring), and more than 25 (Kirana), 40 (Fancy), 30 (Beauty) or 20 (Tailoring) unique customers a month are flagged as warnings. Daily sales come from the daily answer, or the monthly turnover divided by 25. Two flags are specific to CMF. \"Not matched to the target list\" marks a registration since 28 Oct that has no name match on the 398-RWE list. \"Looks like a test record\" marks a male record whose name matches a MAT. Older records from earlier programmes often carry a default date of birth, which is why many show an age below 18.": "CMF के लिए दो और सीमाएँ तय हैं: रोज़ की बिक्री ₹1,000 (Kirana), ₹750 (Fancy), ₹600 (Beauty) या ₹500 (Tailoring) से ऊपर, और महीने में 25 (Kirana), 40 (Fancy), 30 (Beauty) या 20 (Tailoring) से ज़्यादा अलग-अलग ग्राहक, सावधानी की चेतावनी बनते हैं। रोज़ की बिक्री रोज़ के जवाब से ली जाती है, या महीने की बिक्री को 25 से भाग देकर। दो चेतावनियाँ सिर्फ़ CMF की हैं। \"Not matched to the target list\" 28 अक्टूबर के बाद के ऐसे पंजीकरण को दिखाती है जिसका 398 RWE की सूची में नाम नहीं मिला। \"Looks like a test record\" ऐसे पुरुष रिकॉर्ड को दिखाती है जिसका नाम किसी MAT से मिलता है। पुराने कार्यक्रमों के पुराने रिकॉर्ड में अक्सर डिफ़ॉल्ट जन्मतिथि होती है, इसीलिए कई में उम्र 18 से कम दिखती है।", "Daily sales ₹": "रोज़ की बिक्री ₹", ", above the ₹": ", सीमा ₹", " limit for a ": " से ज़्यादा, व्यवसाय: ", "Kirana store": "किराना दुकान", "Fancy store": "फ़ैंसी स्टोर", "Beauty parlor": "ब्यूटी पार्लर m the average daily sale with her and a recent sales record. Correct it if she overstated.": "उससे रोज़ की औसत बिक्री दोबारा पूछें और हाल का बिक्री का हिसाब देखें। अगर बढ़ा-चढ़ाकर बताई है तो ठीक करें।", "Monthly turnover very low or a unit mix-up": "महीने की बिक्री बहुत कम है या इकाई की गड़बड़ी है", "Ask for the average sale per day and correct it. A very low figure often means the amount was entered per customer or in thousands.": "रोज़ की औसत बिक्री पूछकर ठीक करें। बहुत कम रकम का मतलब अक्सर यह होता है कि रकम प्रति ग्राहक या हज़ार में भर दी गई।", "Turnover is zero, negative or not a valid number": "बिक्री शून्य, ऋण या गलत संख्या है", "Re-collect the turnover (average daily sale x 25 days) and update the form.": "बिक्री दोबारा पूछें (रोज़ की औसत बिक्री x 25 दिन) और फ़ॉर्म ठीक करें।", "Spend per customer per month is impossible for a rural last-mile shop": "एक ग्राहक का महीने का खर्च गाँव की दुकान के लिए असंभव है", "Ask both numbers again. Check how many customers buy in a normal week and how much one customer spends in a month. Correct turnover or customer count, whichever is wrong.": "दोनों संख्याएँ दोबारा पूछें। देखें कि आम हफ़्ते में कितने ग्राहक आते हैं और एक ग्राहक महीने में कितना खर्च करता है। बिक्री या ग्राहक संख्या, जो गलत हो, ठीक करें।", "Spend per customer per month looks high": "एक ग्राहक का महीने का खर्च ज़्यादा लगता है", "Re-confirm the unique customer count and the turnover. Most likely the customer count is understated.": "अलग-अलग ग्राहकों की संख्या और बिक्री दोबारा पूछें। संभव है कि ग्राहक संख्या कम लिखी गई हो।", "Spend per customer per month is too low": "एक ग्राहक का महीने का खर्च बहुत कम है", "Re-confirm the customer count. It may have been entered as total footfall or in the wrong unit.": "ग्राहक संख्या दोबारा पूछें। हो सकता है कुल आवाजाही या गलत इकाई भर दी गई हो।", "Customer count is not possible for this business": "ग्राहकों की संख्या इस व्यवसाय में संभव नहीं है", "Re-ask the number of different customers served in a month and correct it. Counts this large are usually extra zeros or a phone number typed in the field.": "महीने में कितने अलग-अलग ग्राहक आते हैं, दोबारा पूछकर ठीक करें। इतनी बड़ी संख्या अक्सर फ़ालतू शून्य या खाने में मोबाइल नंबर लिख देने से होती है।", "Customer count looks too high for this business type": "ग्राहकों की संख्या इस व्यवसाय के लिए ज़्यादा लगती है", "Check against her daily footfall and correct if needed.": "रोज़ की आवाजाही से मिलाकर देखें और ज़रूरत हो तो ठीक करें।", "Reports sales but zero customers": "बिक्री बताई है पर ग्राहक शून्य हैं", "Re-collect the unique customer count.": "अलग-अलग ग्राहकों की संख्या दोबारा पूछें।", "Investment in the business is not credible": "व्यवसाय में लगाई रकम भरोसे लायक नहीं है", "Re-ask the total money put into stock and equipment. Correct the amount; values like these are usually extra zeros or an ID typed in the field.": "माल और सामान में लगी कुल रकम दोबारा पूछें और ठीक करें। ऐसी रकम अक्सर फ़ालतू शून्य या खाने में ID लिख देने से होती है।", "Investment looks very high for a village micro-business": "गाँव के छोटे व्यवसाय के लिए लगाई रकम बहुत ज़्यादा लगती है", "Re-confirm the investment amount with her.": "उससे लगाई रकम दोबारा पक्की करें।", "Investment far too low for the reported turnover": "बताई गई बिक्री के हिसाब से लगाई रकम बहुत कम है", "Ask what the shop stock and equipment is worth and correct the investment.": "पूछें कि दुकान का माल और सामान कितने का है और लगाई रकम ठीक करें।", "Business tenure is impossible": "व्यवसाय के सालों की संख्या असंभव है", "Re-ask how many years she has been running the business and correct it. The value looks like a year or a typing error.": "उससे पूछें कि वह कितने साल से व्यवसाय चला रही है और ठीक करें। यह संख्या साल या टाइपिंग की गलती लगती है।", "Business tenure does not fit her age": "व्यवसाय के साल उसकी उम्र से मेल नहीं खाते", "Verify her date of birth and the year she started the business, and correct whichever is wrong.": "उसकी जन्मतिथि और व्यवसाय शुरू करने का साल जाँचें और जो गलत हो उसे ठीक करें।", "RWE appears t   var o=null;for(var i=0;i<TPL.length;i++){var m=TPL[i][0].exec(t);if(m){o=lead+TPL[i][1].apply(null,m)+trail;break;}}
  if(o===null){o=s;
  o=o.replace(fragRe,function(k){return frag[k];});}
  o=o.replace(/(\d+) of (\d+)/g,function(m,a,b){return b+' में से '+a;});
  o=o.replace(/(\d+) hrs?\b/g,'$1 घंटे').replace(/(\d+) mins?\b/g,'$1 मिनट').replace(/(\d+) yrs?\b/g,'$1 साल').replace(/\+(\d+) more/g,'+$1 और').replace(/(\d+) met: /g,'$1 से मिली: ').replace(/\bAge (\d)/g,'उम्र $1').replace(/(\d+) calls\b/g,'$1 कॉल');
  o=o.replace(monRe,function(m,d,mo){return d+' '+MON[mo];}).replace(/ (Oct|Nov|Sep|Dec)\b/g,function(m,mo){return ' '+MON[mo];});
  o=o.replace(dayRe,function(m,d){return DAY[d];});
  o=o.replace(nameRe,function(m){return NAMES[m]||m;});
  return o;
}
var ORIG=new WeakMap(),TR=new WeakMap(),lang='en',obs;
var ATTRS=['placeholder','title','aria-label'];
function inSkip(n){var e=n.parentNode;return e&&e.closest&&e.closest('[data-nt],script,style');}
function doNode(n){
  if(inSkip(n))return;
  var cur=n.data,o=ORIG.get(n);
  if(o!==undefined&&TR.get(n)===cur)return;
  var v=trs(cur);ORIG.set(n,cur);TR.set(n,v);if(v!==cur)n.data=v;else TR.set(n,cur);
}
function doEl(e){
  if(e.closest&&e.closest('[data-nt]'))return;
  ATTRS.forEach(function(a){if(e.hasAttribute&&e.hasAttribute(a)){
    var k='_o_'+a,cur=e.getAttribute(a);
    if(e[k]===undefined||e['_t_'+a]!==cur){e[k]=cur;var v=trs(cur);e['_t_'+a]=v;if(v!==cur)e.setAttribute(a,v);}
  }});
}
function walk(r){
  var w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT),n,list=[];
  while((n=w.nextNode()))list.push(n);list.forEach(doNode);
  if(r.nodeType===1){doEl(r);}
  var els=r.querySelectorAll?r.querySelectorAll('[placeholder],[title],[aria-label]'):[];
  for(var i=0;i<els.length;i++)doEl(els[i]);
}
function restore(){
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),n,list=[];
  while((n=w.nextNode()))list.push(n);
  list.forEach(function(n){var o=ORIG.get(n);if(o!==undefined&&TR.get(n)===n.data)n.data=o;ORIG.delete(n);TR.delete(n);});
  root.querySelectorAll('*').forEach(function(e){ATTRS.forEach(function(a){var k='_o_'+a;if(e[k]!==undefined){if(e.getAttribute(a)===e['_t_'+a])e.setAttribute(a,e[k]);delete e[k];delete e['_t_'+a];}});});
}
function pending(){obs&&obs.disconnect();}
function watch(){obs.observe(root,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:ATTRS});}
function run(muts){
  if(lang!=='hi')return;
  obs.disconnect();
  try{muts.forEach(function(m){
    if(m.type==='childList'){m.addedNodes.forEach(function(n){if(n.nodeType===3)doNode(n);else if(n.nodeType===1)walk(n);});}
    else if(m.type==='characterData')doNode(m.target);
    else if(m.type==='attributes')doEl(m.target);
  });}finally{watch();}
}
obs=new MutationObserver(run);
function setLang(l){
  lang=l;
  try{localStorage.setItem(LS,l);}catch(e){}
  obs.disconnect();
  root.setAttribute('lang',l==='hi'?'hi':'en');root.classList.toggle('hi',l==='hi');
  if(l==='hi')walk(root);else restore();
  document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===l?'true':'false');});
  watch();
}
document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){setLang(b.dataset.l);});});
var saved='en';try{saved=localStorage.getItem(LS)||'en';}catch(e){}
setLang(saved==='hi'?'hi':'en');
window.__setLang=setLang;
})();
